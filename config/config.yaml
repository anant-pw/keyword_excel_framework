# Runtime configuration for the keyword-driven framework.

browser: chromium              # chromium | firefox | webkit
headless: true
base_url: ""                   # left blank - each Navigate step uses a full URL
default_timeout_ms: 15000
slow_mo_ms: 0

# Which Suite from the Excel sheet this run should execute.
# Smoke              -> fail-fast: stop the test case on first step failure
# Sanity / Regression -> continue-on-failure: run all steps, mark case failed at the end
suite: Regression

test_sheet_file: testsheets/TestSuite.xlsx
properties_dir: properties
common_dir: common
report_dir: reports
screenshot_on_failure: true
history_limit: 10
workers: 1                     # >1 runs test cases across parallel worker processes

viewport_width: 1440
viewport_height: 900

# Demo/local fallback values for {{VAR}} tokens inside properties/*.properties
# files. In CI, the same {{VAR}} names should instead be set as real OS
# environment variables (e.g. GitHub Actions secrets) - those take priority
# over this block automatically, see core/properties_loader.py.
env_variables:
  searchTerm: "Playwright automation"

# Test Scenario -> owner mapping for report/email routing, see
# core/owners_loader.py. Kept in its own file, not a TestSuite.xlsx column,
# since ownership changes independently of test steps.
owners_file: config/owners.yaml

# Post-run notification email (core/notifier.py). Disabled by default -
# flip enabled: true and fill in smtp_host/from_address/to_addresses to
# turn it on. The SMTP password is NEVER read from this file - set
# SMTP_PASSWORD as an OS/CI secret env var instead (same pattern as
# {{VAR}} secrets in properties/*.properties).
email:
  enabled: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: "mblade455@gmail.com"
  from_address: "mblade455@gmail.com"

  to_addresses:
    - "anant.jain@impactqa.com"
  send_on: failure_only        # failure_only | always - failure_only avoids alert fatigue on green runs
  attach_report: true          # attach the HTML report file directly (see notifier.py docstring on why
  attach_summary: true         # not just a link) rather than the full HTML/xlsx
  cc_owners_on_failure: true   # CC each failed scenario's owner (from owners_file), in addition to to_addresses
  report_base_url: ""          # optional - only set once reports are actually published somewhere reachable
