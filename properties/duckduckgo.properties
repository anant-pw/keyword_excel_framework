# Object repository + data indirection for the DuckDuckGo search flow.
# Loaded via: LoadProperties keyword, Test Data = "duckduckgo"
# Reference in the sheet as $key in either LocatorValue or Test Data.
# {{VAR}} inside a value resolves from OS environment first, then
# config.yaml env_variables as a demo/local fallback.

searchBox=input[name='q']
searchButtonAny={"testid": "searchbox_homepage_submit", "css": "button[type='submit']", "xpath": "//button[@aria-label='Search']"}
demoSearchTerm={{searchTerm}}